<!DOCTYPE html>
<html lang="pt-BR" data-section="gifts">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nossa Lista de Coisas 🎁</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#E8856A" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/gifts.css" />
  <link rel="stylesheet" href="css/restaurants.css" />
  <link rel="stylesheet" href="css/travels.css" />
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-emoji">🎁</div>
    <h1>Nossa Lista de Coisas</h1>
    <p>Entre com sua conta Google para ver e editar nossas listas.</p>
    <button class="google-btn" id="loginBtn" type="button">
      <svg class="google-icon" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.29-8.16 2.29-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Entrar com Google
    </button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <header>
    <h1>Nossa Lista de Coisas ✨</h1>
    <p>onde podemos adicionar tudo que quisermos fazer</p>
    <div class="user-bar">
      <img class="user-avatar" id="userAvatar" src="" alt="" onerror="this.style.display='none'" />
      <span class="user-name" id="userName"></span>
      <button type="button" class="logout-btn">Sair</button>
    </div>
  </header>

  <div class="status-bar" id="statusBar">
    <div class="status-dot"></div>
    <span id="statusText">Conectando...</span>
  </div>

  <nav class="main-nav">
    <button type="button" class="main-nav-btn active" id="nav-gifts"><span class="nav-icon">🎁</span>Presentes</button>
    <button type="button" class="main-nav-btn" id="nav-restaurants"><span class="nav-icon">🍽️</span>Restaurantes</button>
    <button type="button" class="main-nav-btn" id="nav-travels"><span class="nav-icon">✈️</span>Viagens</button>
  </nav>

  <div class="section-panel active" id="panel-gifts"></div>
  <div class="section-panel" id="panel-restaurants"></div>
  <div class="section-panel" id="panel-travels"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
